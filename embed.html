      THE MAP.

      `type="text/plain"` so the browser does not execute it and does not parse
      its contents as HTML, which is what makes a raw `.argmap` block safe to

      Left EMPTY on purpose: with no source the viewer shows its built-in
      fallback map (src/embed/source.ts), so this page is directly openable
      during development and an author who forgets the block still sees
