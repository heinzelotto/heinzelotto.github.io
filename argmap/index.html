<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ArgMap has moved to p1graph.org</title>
<link rel="canonical" href="/">
<!-- Query and fragment are carried over: share links already in the wild look
     like /argmap/?sel=…&unfold=…&cam=…, and dropping the query would strand
     them on the default view. The meta refresh below is the no-JS fallback and
     is the only path that loses them. -->
<script>location.replace('/' + location.search + location.hash);</script>
<meta http-equiv="refresh" content="0; url=/">
<style>body{font:16px/1.5 system-ui,sans-serif;margin:4rem auto;max-width:32rem;padding:0 1rem}</style>
</head>
<body>
<p>ArgMap has moved to the site root — <a href="/">p1graph.org</a>.</p>
</body>
</html>
